<!DOCTYPE html>
<html>
<head>
  <title>Store</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body onload="displayUser()">
 
<div class="box">
  <button class="logout-btn" onclick="logout()">Log Out</button>
  <h2>Kram's Store</h2>
  <p id="user"></p>

  <h3>snacks</h3>
  <div class="store">
    <div class="item">
      <img src="images/burger.webp" alt="Burger">
      <h4>Burger</h4><p>₱50</p>
      <button onclick="add('Burger',50)">Add</button>
    </div>
    <div class="item">
      <img src="images/pizza.jpg" alt="Pizza">
      <h4>Pizza</h4><p>₱120</p>
      <button onclick="add('Pizza',120)">Add</button>
    </div>
    <div class="item">
      <img src="images/fries.jpg" alt="Fries">
      <h4>Fries</h4><p>₱40</p>
      <button onclick="add('Fries',40)">Add</button>
    </div>
    <div class="item">
      <img src="images/hot_dog_PNG10220.png" alt="Hotdog">
      <h4>Hotdog</h4><p>₱35</p>
      <button onclick="add('Hotdog',35)">Add</button>
    </div>
    <div class="item">
      <img src="images/sandwich.png" alt="Sandwich">
      <h4>Sandwich</h4><p>₱45</p>
      <button onclick="add('Sandwich',45)">Add</button>
    </div>
  </div>

  <h3>Drinks </h3>
  <div class="store">
    <div class="item">
      <img src="images/coke.jpg" alt="Coke">
      <h4>Coke</h4><p>₱25</p>
      <button onclick="add('Coke',25)">Add</button>
    </div>
    <div class="item">
      <img src="images/Oreo-Milkshake-2.jpg" alt="Milkshake">
      <h4>Milkshake</h4><p>₱60</p>
      <button onclick="add('Milkshake',60)">Add</button>
    </div>
    <div class="item">
      <img src="images/juice.jpg" alt="Juice">
      <h4>Juice</h4><p>₱40</p>
      <button onclick="add('Juice',40)">Add</button>
    </div>
    <div class="item">  
      <img src="images/coffe.jpg" alt="Coffee">
      <h4>Coffee</h4><p>₱35</p>
      <button onclick="add('Coffee',35)">Add</button>
    </div>
    <div class="item">
      <img src="images/cup-of-tea-with-fresh-tea-leaves-on-saucer-transparant-background-png.png" alt="Tea">
      <h4>Tea</h4><p>₱30</p>
      <button onclick="add('Tea',30)">Add</button>
    </div>
  </div>

 <div class="cart">
  <h3>Cart</h3>

  <ul id="cartList"></ul>
  <h4 id="total"></h4>

  <!-- ✅ PAYMENT SYSTEM -->
  <label>Payment Method:</label>
  <select id="paymentMethod" onchange="togglePaymentFields()">
    <option value="cash">Cash</option>
    <option value="gcash">GCash</option>
  </select>

  <!-- CASH INPUT -->
  <input type="number" id="cashGiven" placeholder="Cash amount" />

  <!-- GCASH INPUT (hidden by default) -->
  <input type="text" id="gcashNumber" placeholder="GCash Number / Account Number" style="display:none;" />

  <div id="changeDisplay"></div>

  <button onclick="buy()">Buy</button>
</div>
 
<script src="script.js"></script>
</body>
</html>
